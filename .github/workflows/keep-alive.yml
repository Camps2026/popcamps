name: Supabase keep-alive

on:
  schedule:
    # Every 3 days at 15:17 UTC (about 7–8am Pacific)
    - cron: '17 15 */3 * *'
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one camp from Supabase
        env:
          SUPABASE_URL: https://ikhvkrbwwnapeofqpxdb.supabase.co
          SUPABASE_KEY: sb_publishable_YPY0o2fRbGoDP1CBFoZb-A_11ucDenw
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error --fail-with-body \
            --max-time 30 --retry 3 --retry-delay 20 --retry-all-errors \
            "$SUPABASE_URL/rest/v1/camps?select=id,camp_name&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase answered: $response"
          if ! echo "$response" | grep -q '"id"'; then
            echo "::error::Supabase answered but returned no camp rows"
            exit 1
          fi
          echo "Supabase is awake and serving camps."
